[build]
  command = "bash scripts/install-mdbook.sh && npm run build"
  publish = "apps/calculator/dist/public"

[[redirects]]
  from = "/admin"
  to = "/admin/index.html"
  status = 200

[[redirects]]
  from = "/quick-project-scan"
  to = "/project-scan"
  status = 301

[[redirects]]
  from = "/quick-project-scan/*"
  to = "/project-scan"
  status = 301

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
