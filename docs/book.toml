[book]
title = "SD Standard Criteria Knowledge Base"
authors = ["Valerie Elliot, Tuuli Sauren, Alex Quinto"]
language = "en"
src = "src"

[build]
build-dir = "book"

[output.html]
git-repository-url = "https://github.com/alexquintoc/sd-standard"
edit-url-template = "https://github.com/alexquintoc/sd-standard/edit/repo-restructure/docs/{path}"
additional-css = ["theme/sd-standard.css"]
additional-js = ["theme/sd-standard-nav.js", "theme/google-analytics.js"]

